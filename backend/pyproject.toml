[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tribesignal-backend"
version = "0.1.0"
description = "Transparent infrastructure issue triage with deterministic priority"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=2.25,<3.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
